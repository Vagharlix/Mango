name: README screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - app/src/test/java/com/mango/ReadmeScreenshots.kt
      - .github/workflows/screenshots.yml

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Render the app screens with demo data
        run: ./gradlew testDebugUnitTest --tests com.mango.ReadmeScreenshots -Pscreenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-screenshots
          path: |
            app/build/readme-screenshots
            app/build/reports/tests
