name: Release

# Push a tag like v0.10.0 (or run it from the Actions tab with a tag name) to build a signed APK
# and publish it in a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag to publish (ex. v0.10.0)
        type: string
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives in repository secrets (Settings > Secrets and variables > Actions):
      #   MANGO_KEYSTORE_BASE64   = base64 of mango-release.jks
      #   MANGO_KEYSTORE_PASSWORD = its password (alias: mango)
      # Without them a throw-away key is used: that APK installs, but cannot update a version
      # signed with another key (uninstalling erases the app's data).
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.MANGO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MANGO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > mango-release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::MANGO_KEYSTORE_BASE64 / MANGO_KEYSTORE_PASSWORD secrets not set: signing with a temporary key."
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore mango-release.jks -alias mango -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Mango"
          fi
          printf "storeFile=mango-release.jks\nstorePassword=%s\nkeyAlias=mango\nkeyPassword=%s\n" "$PASS" "$PASS" > keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the signed APK
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Mango-$TAG.apk"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Mango ${{ env.TAG }}
          prerelease: true
          files: dist/*.apk
          body_path: .github/release-notes.md
